app = "perpduel-api"
primary_region = "ams"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  BIND_ADDR = "0.0.0.0"
  BACKEND_PORT = "8080"
  EXECUTOR_URL = "http://127.0.0.1:4101"
  EXECUTOR_PORT = "4101"
  DUEL_STORE = "/data/duels.json"

[[mounts]]
  source = "perpduel_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
